<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Andrea Bruni monogram</title>
  <desc id="desc">White AB initials on a modern night-sky background.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152F"/>
      <stop offset="0.55" stop-color="#102A55"/>
      <stop offset="1" stop-color="#1B4975"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="14%" r="58%">
      <stop offset="0" stop-color="#7DD3FC" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020817" flood-opacity="0.35"/>
    </filter>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="116"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <rect width="512" height="512" fill="url(#glow)"/>

    <!-- Small stars add depth without competing with the monogram. -->
    <g fill="#E0F2FE">
      <circle cx="88" cy="104" r="3" opacity="0.85"/>
      <circle cx="414" cy="94" r="4" opacity="0.72"/>
      <circle cx="374" cy="174" r="2.5" opacity="0.55"/>
      <circle cx="116" cy="388" r="2.5" opacity="0.5"/>
    </g>
    <path d="M418 128l4 10 10 4-10 4-4 10-4-10-10-4 10-4 4-10z" fill="#F8FAFC" opacity="0.8"/>

    <rect x="28" y="28" width="456" height="456" rx="94" fill="none" stroke="#BAE6FD" stroke-opacity="0.2" stroke-width="4"/>

    <text x="256" y="319"
      text-anchor="middle"
      font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-size="190"
      font-weight="750"
      letter-spacing="-18"
      fill="#FFFFFF"
      filter="url(#shadow)">AB</text>

    <rect x="176" y="369" width="160" height="6" rx="3" fill="#BAE6FD" opacity="0.8"/>
  </g>
</svg>
